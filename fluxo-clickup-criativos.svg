<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      .bg { fill: #f6f7f4; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 54px; font-weight: 800; fill: #14213d; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill: #4f5d75; }
      .panel { fill: #ffffff; stroke: #d7dee2; stroke-width: 2; rx: 18; }
      .box { fill: #ffffff; stroke: #c9d3d8; stroke-width: 3; rx: 14; }
      .blue { fill: #e8f1ff; stroke: #3a86ff; stroke-width: 3; rx: 14; }
      .green { fill: #e8f7ef; stroke: #2f9e65; stroke-width: 3; rx: 14; }
      .yellow { fill: #fff3d6; stroke: #f2b705; stroke-width: 3; rx: 14; }
      .red { fill: #fff0ed; stroke: #e5484d; stroke-width: 3; rx: 14; }
      .dark { fill: #14213d; stroke: #14213d; stroke-width: 3; rx: 14; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 800; fill: #14213d; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #4f5d75; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #4f5d75; }
      .white-label { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 800; fill: #ffffff; }
      .white-small { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #dbe4ea; }
      .rule-title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 800; fill: #14213d; }
      .rule { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #243447; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #e5484d; stroke-width: 4; fill: none; marker-end: url(#arrowhead-red); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#e5484d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1200"/>

  <text class="title" x="90" y="100">Fluxo ClickUp Criativo</text>
  <text class="subtitle" x="92" y="145">Esteira focada em tarefas e entregas. Publicacao fica no calendario externo da social media.</text>

  <rect class="dark" x="90" y="195" width="1420" height="105"/>
  <text class="white-label" x="130" y="240">Regra central</text>
  <text class="white-small" x="130" y="274">Due date = prazo interno para a entrega estar criada, revisada e aprovada.</text>

  <rect class="panel" x="90" y="350" width="930" height="735"/>
  <text class="rule-title" x="130" y="400">Status aprovados</text>

  <rect class="box" x="335" y="445" width="440" height="78"/>
  <text class="label" x="555" y="493" text-anchor="middle">ideia</text>

  <line class="arrow" x1="555" y1="523" x2="555" y2="580"/>
  <rect class="blue" x="335" y="585" width="440" height="78"/>
  <text class="label" x="555" y="633" text-anchor="middle">aprovacao de copy</text>

  <path class="arrow-red" d="M335 624 C235 624, 215 707, 335 747"/>
  <text class="tiny" x="238" y="596" text-anchor="middle">se precisa melhorar</text>
  <rect class="yellow" x="335" y="720" width="440" height="78"/>
  <text class="label" x="555" y="768" text-anchor="middle">ajuste</text>
  <path class="arrow" d="M775 759 C880 745, 880 642, 775 624"/>

  <line class="arrow" x1="555" y1="663" x2="555" y2="855"/>
  <text class="tiny" x="605" y="850">se esta completa</text>
  <rect class="green" x="335" y="860" width="440" height="78"/>
  <text class="label" x="555" y="908" text-anchor="middle">pronto para criacao</text>

  <line class="arrow" x1="775" y1="899" x2="950" y2="899"/>
  <rect class="blue" x="970" y="860" width="440" height="78"/>
  <text class="label" x="1190" y="908" text-anchor="middle">revisao</text>

  <line class="arrow" x1="1190" y1="938" x2="1190" y2="995"/>
  <rect class="blue" x="970" y="1000" width="440" height="78"/>
  <text class="label" x="1190" y="1048" text-anchor="middle">aprovacao(cliente)</text>

  <line class="arrow" x1="970" y1="1039" x2="775" y2="1039"/>
  <rect class="green" x="335" y="1000" width="440" height="78"/>
  <text class="label" x="555" y="1032" text-anchor="middle">aprovado</text>
  <text class="small" x="555" y="1058" text-anchor="middle">status de fechamento</text>

  <rect class="red" x="970" y="585" width="440" height="130"/>
  <text class="label" x="1190" y="637" text-anchor="middle">problema externo/interno</text>
  <text class="small" x="1190" y="668" text-anchor="middle">cliente, material, escopo, copy,</text>
  <text class="small" x="1190" y="695" text-anchor="middle">criacao ou revisao bloqueada</text>

  <path class="arrow-red" d="M775 624 C870 620, 900 650, 970 650"/>
  <path class="arrow-red" d="M1190 860 C1190 805, 1190 765, 1190 715"/>
  <path class="arrow-red" d="M1190 1000 C1295 930, 1305 800, 1230 715"/>

  <rect class="panel" x="1060" y="350" width="450" height="185"/>
  <text class="rule-title" x="1100" y="400">Descricao obrigatoria</text>
  <text class="rule" x="1100" y="448">1. Direcionamento</text>
  <text class="rule" x="1100" y="482">2. Roteiro</text>
  <text class="rule" x="1100" y="516">3. Legenda</text>

  <text class="subtitle" x="90" y="1150">Vizantu | Fluxo aprovado em 2026-06-09</text>
</svg>
