      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #526174; }
      .panel { fill: #ffffff; stroke: #d8e0e5; stroke-width: 2; rx: 18; }
      .box { fill: #ffffff; stroke: #cfd8de; stroke-width: 3; rx: 14; }
      .blue { fill: #e8f1ff; stroke: #3a86ff; stroke-width: 4; rx: 14; }
      .green { fill: #e8f7ef; stroke: #2f9e65; stroke-width: 4; rx: 14; }
      .yellow { fill: #fff4d9; stroke: #f2b705; stroke-width: 4; rx: 14; }
      .red { fill: #fff0ed; stroke: #e5484d; stroke-width: 4; rx: 14; }
