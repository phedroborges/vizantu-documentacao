      .white-small { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #dbe4ea; }
      .footer { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #526174; }
      .arrow { stroke: #475569; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .arrow-red { stroke: #e5484d; stroke-width: 3.2; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
